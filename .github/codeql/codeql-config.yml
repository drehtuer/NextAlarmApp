# CodeQL configuration for .github/workflows/codeql.yml. See docs/development.md#dependency-updates-and-security.
name: NextAlarm CodeQL configuration

query-filters:
  # The Kotlin compiler's equals() for a `data object` casts `other` into a variable it never reads, so every data object
  # was reported on the first line of its file. Unused variables in the source are still reported by the Kotlin
  # compiler and by SonarCloud (kotlin:S1481).
  - exclude:
      id: java/local-variable-is-never-read
