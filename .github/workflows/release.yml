# Builds, signs and publishes a release when a version tag (v<versionName>, e.g. v0.1.0) is pushed, then publishes the
# documentation of that release. See docs/development.md#releases.
#
# Releases are immutable once published, so everything is built and checked before the release exists: it is created
# as a draft, gets its files, and is only then published.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Build provenance for the APK.
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag against the app's version
        id: version
        run: |
          version=$(sed -nE 's/^\s*versionName = "([^"]+)"$/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Without the key the release would be unsigned, and a published release cannot be fixed afterwards.
      - name: Install the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_KEYSTORE_PASSWORD" ]; then
            echo "::error::The secrets SIGNING_KEYSTORE_BASE64 and SIGNING_KEYSTORE_PASSWORD are needed to sign the release."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # No cache from other branches: a release is built from what the tag says.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # Keep these versions in line with .devcontainer/Dockerfile and build.yml.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Test and build the release
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: ./gradlew coverageReports :app:assembleRelease

      - name: Verify the signature
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="app/build/outputs/named-apk/release/NextAlarm-$VERSION.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -q "certificate SHA-256 digest" "$RUNNER_TEMP/certs.txt"
          mkdir dist
          cp "$apk" dist/
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          rm "$SIGNING_KEYSTORE_FILE"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # Versions before 1.0 are pre-releases.
      - name: Create the draft, add the files, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in
            0.*) prerelease=(--prerelease) ;;
            *) ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft "${prerelease[@]}" \
            --title "NextAlarm $VERSION" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false

  documentation:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
