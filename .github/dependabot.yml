# Dependency updates. See docs/development.md#dependency-updates-and-security.
# Gradle pull requests also need gradle/verification-metadata.xml regenerated by hand before they can pass.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # A release needs time to show it is sound before it is pulled in.
    cooldown:
      default-days: 14
    groups:
      # One pull request for all minor and patch updates, so the checksums are regenerated once.
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]

  # The base image of the dev container. The Android SDK versions in it are build arguments and are updated by hand.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: monthly
    cooldown:
      default-days: 14

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
